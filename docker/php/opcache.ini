; OPcache tuning for Laravel. Big win on Docker + Windows bind mounts where
; re-parsing PHP files on every request is expensive.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
; Laravel + vendor easily exceeds the default 10000 file cap.
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=15
; Dev-friendly: still picks up edited files (checked at most every 2s),
; while keeping compiled opcode in memory.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
opcache.fast_shutdown=1

; Reduce filesystem path lookups across the (slow) bind mount.
realpath_cache_size=8192K
realpath_cache_ttl=600
